<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Mobile Live Wallpapers</title>
  
  <!-- Adsterra Script -->
  <script src="https://pl21529180.profitableratenetwork.com/40/c0/32/40c93285ddf7561fad138162c047c1ec.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background: #0b0c10; color: #fff; padding-bottom: 50px; }
    
    header {
      text-align: center;
      padding: 16px 12px;
      position: sticky;
      top: 0;
      background: rgba(11, 12, 16, 0.95);
      backdrop-filter: blur(8px);
      z-index: 100;
      border-bottom: 1px solid #1f2833;
    }
    header h1 { font-size: 1.25rem; color: #66fcf1; }
    header p { font-size: 0.75rem; color: #888; margin-top: 4px; }

    .container {
      max-width: 800px;
      margin: 12px auto;
      padding: 0 12px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .card {
      background: #1f2833;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .video-wrap {
      width: 100%;
      aspect-ratio: 9 / 16;
      background: #111;
      position: relative;
    }

    .video-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      cursor: pointer;
    }

    .meta {
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .meta span {
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-download {
      background: #45a29e;
      color: #0b0c10;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 7px 0;
      text-align: center;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Mobile Live Wallpapers</h1>
    <p>Tap download to save 9:16 HD loops</p>
  </header>

  <main class="container">

    <!-- Card 1 -->
    <div class="card">
      <div class="video-wrap">
        <video class="live-vid" loop muted playsinline webkit-playsinline preload="auto" src="https://cdn.pixabay.com/video/2020/05/25/40149-425254181_tiny.mp4"></video>
      </div>
      <div class="meta">
        <span>Neon Wave</span>
        <a href="https://cdn.pixabay.com/video/2020/05/25/40149-425254181_tiny.mp4" download class="btn-download" target="_blank">Download</a>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="card">
      <div class="video-wrap">
        <video class="live-vid" loop muted playsinline webkit-playsinline preload="auto" src="https://cdn.pixabay.com/video/2021/08/04/83875-584065609_tiny.mp4"></video>
      </div>
      <div class="meta">
        <span>Cyber Matrix</span>
        <a href="https://cdn.pixabay.com/video/2021/08/04/83875-584065609_tiny.mp4" download class="btn-download" target="_blank">Download</a>
      </div>
    </div>

    <!-- Card 3 -->
    <div class="card">
      <div class="video-wrap">
        <video class="live-vid" loop muted playsinline webkit-playsinline preload="auto" src="https://cdn.pixabay.com/video/2022/10/05/133743-757685651_tiny.mp4"></video>
      </div>
      <div class="meta">
        <span>Galaxy Motion</span>
        <a href="https://cdn.pixabay.com/video/2022/10/05/133743-757685651_tiny.mp4" download class="btn-download" target="_blank">Download</a>
      </div>
    </div>

  </main>

  <script>
    // Force Autoplay for Mobile Browsers
    document.addEventListener("DOMContentLoaded", () => {
      const videos = document.querySelectorAll(".live-vid");
      videos.forEach(vid => {
        vid.muted = true;
        const playPromise = vid.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            // Agar browser auto-play block kare toh first user touch par chalayein
            document.body.addEventListener("touchstart", () => vid.play(), { once: true });
          });
        }
      });
    });
  </script>

</body>
</html>
